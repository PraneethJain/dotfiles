set-option -g status-style bg=#000000,fg=white
set-option -g message-style bg=#000000,fg=brightgreen
set -g mouse on
set -g status-left-length 40
setw -g mode-keys vi
set -g default-terminal "st-256color"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'

bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard"
bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel "xclip -selection clipboard"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -selection clipboard"

unbind s
bind-key s set-option status

unbind &
bind q kill-window

unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded!"

run '~/.tmux/plugins/tpm/tpm'
