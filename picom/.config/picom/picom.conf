blur:
{
  method = "dual_kawase";
  size = 10;
  strength = 3;
  deviation = true;
};

blur-background = true
blur-background-fixed = true


shadow-radius = 1;
shadow-opacity = 0.6

shadow-offset-x = 0;
shadow-offset-y = 0;

shadow-color = "#000000"
fading = false;

backend = "egl";

dithered-present = false;
vsync = true;

detect-rounded-corners = false
detect-client-opacity = true;
use-ewmh-active-win = true
detect-transient = true;
use-damage = true;
log-level = "warn";

rules = (
	# { match = "name = 'dwm'"; opacity = 1; },
	{ match = "focused"; opacity = 1; },
	{ match = "!focused"; opacity = 0.95; },
	{ match = "tooltip"; fade = true; shadow = true; opacity = 0.5; focus = true; full-shadow = false; },
	{ match = "popup_menu"; opacity = 0.7; },
	{ match = "dropdown_menu"; opacity = 0.7; },
    { match = "class_g = 'qutebrowser'"; shadow = true; full-shadow = true; },
    { match = "class_g *?= 'slop'"; blur-background = false; opacity = 1; focus = true; },
    { match = "class_g *?= 'screenkey'"; blur-background = false; opacity = 1; focus = true; },)
